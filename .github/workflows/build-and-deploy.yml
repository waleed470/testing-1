name: Sequential Branch Processing

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [trigger]  # Sirf trigger branch pe chalega

jobs:
  # F1 Processing - Part 1, 2, 3 sequentially
  process_f1_part1:
    name: F1 - Part 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F1 Part 1
        run: |
          echo "🔄 STARTING F1 - PART 1"
          sleep 10
          echo "✅ F1 - PART 1 COMPLETED"

  process_f1_part2:
    name: F1 - Part 2
    runs-on: ubuntu-latest
    needs: process_f1_part1  # Part 1 ke complete hone ka wait karega
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F1 Part 2
        run: |
          echo "🔄 STARTING F1 - PART 2"
          sleep 10
          echo "✅ F1 - PART 2 COMPLETED"

  process_f1_part3:
    name: F1 - Part 3
    runs-on: ubuntu-latest
    needs: process_f1_part2  # Part 2 ke complete hone ka wait karega
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F1 Part 3
        run: |
          echo "🔄 STARTING F1 - PART 3"
          sleep 10
          echo "✅ F1 - PART 3 COMPLETED"
          echo "🎉 F1 COMPLETED ALL PARTS"

  # F2 Processing - F1 complete hone ke baad start hoga
  process_f2_part1:
    name: F2 - Part 1
    runs-on: ubuntu-latest
    needs: process_f1_part3  # F1 complete hone ka wait karega
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F2 Part 1
        run: |
          echo "🔄 STARTING F2 - PART 1"
          sleep 10
          echo "✅ F2 - PART 1 COMPLETED"

  process_f2_part2:
    name: F2 - Part 2
    runs-on: ubuntu-latest
    needs: process_f2_part1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F2 Part 2
        run: |
          echo "🔄 STARTING F2 - PART 2"
          sleep 10
          echo "✅ F2 - PART 2 COMPLETED"

  process_f2_part3:
    name: F2 - Part 3
    runs-on: ubuntu-latest
    needs: process_f2_part2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F2 Part 3
        run: |
          echo "🔄 STARTING F2 - PART 3"
          sleep 10
          echo "✅ F2 - PART 3 COMPLETED"
          echo "🎉 F2 COMPLETED ALL PARTS"

  # F3 Processing - F2 complete hone ke baad start hoga
  process_f3_part1:
    name: F3 - Part 1
    runs-on: ubuntu-latest
    needs: process_f2_part3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F3 Part 1
        run: |
          echo "🔄 STARTING F3 - PART 1"
          sleep 10
          echo "✅ F3 - PART 1 COMPLETED"

  process_f3_part2:
    name: F3 - Part 2
    runs-on: ubuntu-latest
    needs: process_f3_part1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F3 Part 2
        run: |
          echo "🔄 STARTING F3 - PART 2"
          sleep 10
          echo "✅ F3 - PART 2 COMPLETED"

  process_f3_part3:
    name: F3 - Part 3
    runs-on: ubuntu-latest
    needs: process_f3_part2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Process F3 Part 3
        run: |
          echo "🔄 STARTING F3 - PART 3"
          sleep 10
          echo "✅ F3 - PART 3 COMPLETED"
          echo "🎉 F3 COMPLETED ALL PARTS"

  # Final Completion
  all_complete:
    name: 🎉 All Processing Complete
    runs-on: ubuntu-latest
    needs: [process_f1_part3, process_f2_part3, process_f3_part3]
    steps:
      - name: All Branches Processed
        run: |
          echo "🎊 ALL BRANCHES PROCESSED SUCCESSFULLY!"
          echo "✅ F1 → F2 → F3 COMPLETED SEQUENTIALLY"
          echo "📊 Each branch: Part 1 → Part 2 → Part 3"